<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" stroke="#2C5240" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
  <title>A frog piping frosting</title>
  <!-- head -->
  <path d="M52 112c0-32 30-54 68-54s68 22 68 54c0 26-24 44-54 46h-28c-30-2-54-20-54-46z"/>
  <!-- eyes -->
  <circle cx="84" cy="64" r="28"/>
  <circle cx="156" cy="64" r="28"/>
  <circle cx="84" cy="68" r="12" fill="#2C5240" stroke="none"/>
  <circle cx="156" cy="68" r="12" fill="#2C5240" stroke="none"/>
  <circle cx="89" cy="62" r="4" fill="#FBF8F1" stroke="none"/>
  <circle cx="161" cy="62" r="4" fill="#FBF8F1" stroke="none"/>
  <!-- freckles + smile -->
  <g fill="#2C5240" stroke="none" opacity=".55">
    <circle cx="76" cy="104" r="2.6"/><circle cx="88" cy="112" r="2.6"/>
    <circle cx="152" cy="112" r="2.6"/><circle cx="164" cy="104" r="2.6"/>
  </g>
  <path d="M90 120c10 14 24 20 30 20s20-6 30-20"/>
