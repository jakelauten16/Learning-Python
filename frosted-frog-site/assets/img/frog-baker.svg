  <path d="M78 160c-12 0-22-8-24-20"/>
  <path d="M54 140l-20-22 34-18 10 28z" stroke="#BE9430"/>
  <path d="M34 118c-8-6-8-16 2-20l12 6" stroke="#BE9430"/>
  <path d="M72 162c14-4 24 4 22 14-2 10-16 14-22 6" stroke="#BE9430"/>
  <!-- right arm, resting -->
  <path d="M166 160c12 0 22-8 24-20"/>
  <!-- lily pad -->
  <path d="M44 214c0-10 34-18 76-18s76 8 76 18" opacity=".45"/>
  <path d="M120 196v18" opacity=".3"/>

</svg>
